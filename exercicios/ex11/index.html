<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem dinâmica</title>
</head>
<body>
    <p>Tete abrir esse site em varios dispositivos difrentes, ou mude o zoom.</p>

    <picture>
        <source media="(max-width: 750px )" srcset="imagens/img_p.jpg" type="image/jpg">
        <source media="(max-width: 1050px )" srcset="imagens/img_m.jpg" type="image/jpg">
        <img src="imagens/img_g.jpg" alt="imagem_g">
    </picture>

    <h1>Reproduzindo áudios</h1>
    <p>Vamos aprender a reproduzir áudios em HTML 5.</p>
    <audio preload="metadata" controls>

<source src="midia/audio.mp3" type="audio/mpeg">
        
    </audio>

</body>
</html>
