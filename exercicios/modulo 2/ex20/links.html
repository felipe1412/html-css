<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color:brown;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: rgb(66, 1, 1);
        }

        a:hover{
            color: black;
            text-decoration: underline;
        }

        a:active{
            color: wheat;
        }

        .especial{
            background-color: aqua;
        }

        .especial::before{
            content: '↔';
        }

        .especial::after{
            content: '↔';
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github,io" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://youtube.com/cursoemvideo" class="especial">Canal do YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com" class="especial">Site do curso em vídeo</a></li>
    </ul>
</body>
</html>
