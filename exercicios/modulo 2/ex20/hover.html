<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
<style>

body{
    font-family: Arial, Helvetica, sans-serif;
}

div >p{
    display: none;

}

div:hover > p {
display: block;
color: white;
background-color: black;
width: 300px;
}

div:hover{
    color: brown;
}

</style>
</head>
<body>
    <h1>Exenplo de hover</h1>
    <p>Passe o mouse sobre o texto abaixo.</p>
    <div>Passe o mouse aqui.
        <p>TEXTO ESCONDIDOOOO.</p>
    </div>
    <p>Fim do exemplo.</p>
</body>
</html>
